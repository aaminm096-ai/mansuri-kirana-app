<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">

  <title>MANSURI KIRANA</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="header">

      <button class="menu-btn" onclick="toggleMenu()">☰</button>

      <div class="brand">
        <h1>MANSURI KIRANA</h1>
        <p>AALAM MANSURI • 9754083323</p>
      </div>

    </header>

    <!-- DATE -->
    <div class="date-box">
      <span>📅</span>
      <span id="todayDate"></span>
    </div>

    <!-- MAIN -->
    <main class="home">

      <!-- BILL -->
      <button class="main-card bill-card" onclick="openBill()">
        <div class="card-icon">🧾</div>
        <div>
          <h2>BILL</h2>
          <p>नया बिल बनाएँ</p>
        </div>
        <span class="arrow">›</span>
      </button>

      <!-- UDHARI / JAMA -->
      <button class="main-card account-card" onclick="openAccount()">
        <div class="card-icon">👤</div>
        <div>
          <h2>UDHARI / JAMA</h2>
          <p>ग्राहक का हिसाब</p>
        </div>
        <span class="arrow">›</span>
      </button>

    </main>

    <!-- CUSTOMER MESSAGE -->
    <div class="customer-message">
      <p>“आपका भरोसा ही हमारी सबसे बड़ी पूंजी है। ❤️”</p>
      <p>“सही सामान, सही हिसाब और बेहतर सेवा—हर बार आपका स्वागत है।”</p>
    </div>

    <!-- MENU -->
    <div id="menuOverlay" class="menu-overlay" onclick="closeMenu(event)">

      <div class="side-menu" onclick="event.stopPropagation()">

        <div class="menu-header">
          <h2>MANSURI KIRANA</h2>
          <button onclick="toggleMenu()">×</button>
        </div>

        <button onclick="openSavedBills()">🧾 Saved Bills</button>
        <button onclick="openStock()">📦 Stock</button>
        <button onclick="openRates()">💰 Rate List</button>
        <button onclick="openSalesReport()">📊 बिक्री Report</button>
        <button onclick="openCustomers()">👥 Customers</button>
        <button onclick="openLedger()">📒 पूरा हिसाब</button>
        <button onclick="openUdhariReport()">📈 Udhari Report</button>
        <button onclick="openJamaReport()">💵 Jama Report</button>
        <button onclick="openStockReport()">📦 Stock Report</button>
        <button onclick="openSettings()">⚙️ Settings</button>
        <button onclick="openBackup()">💾 Backup / Restore</button>
        <button onclick="openLanguage()">🌐 Language</button>
        <button onclick="openAbout()">ℹ️ About</button>

      </div>

    </div>

  </div>

  <!-- APP JAVASCRIPT -->
  <script src="app.js"></script>

  <script>

    function setDate() {
      const dateElement = document.getElementById("todayDate");

      if (dateElement) {
        dateElement.textContent =
          new Date().toLocaleDateString("hi-IN", {
            day: "2-digit",
            month: "long",
            year: "numeric"
          });
      }
    }

    function toggleMenu() {
      const menu = document.getElementById("menuOverlay");

      if (menu) {
        menu.classList.toggle("active");
      }
    }

    function closeMenu(event) {
      if (event.target.id === "menuOverlay") {
        toggleMenu();
      }
    }

    function openBill() {
      alert("BILL section तैयार किया जा रहा है।");
    }

    function openAccount() {
      alert("UDHARI / JAMA section तैयार किया जा रहा है।");
    }

    function openSavedBills() {
      alert("Saved Bills");
    }

    function openStock() {
      alert("Stock");
    }

    function openRates() {
      alert("Rate List");
    }

    function openSalesReport() {
      alert("बिक्री Report");
    }

    function openCustomers() {
      alert("Customers");
    }

    function openLedger() {
      alert("पूरा हिसाब");
    }

    function openUdhariReport() {
      alert("Udhari Report");
    }

    function openJamaReport() {
      alert("Jama Report");
    }

    function openStockReport() {
      alert("Stock Report");
    }

    function openSettings() {
      alert("Settings");
    }

    function openBackup() {
      if (window.MansuriKirana) {
        window.MansuriKirana.exportBackup();
      }
    }

    function openLanguage() {
      alert("Language");
    }

    function openAbout() {
      alert(
        "MANSURI KIRANA\nAALAM MANSURI\n9754083323"
      );
    }

    setDate();

  </script>

</body>
</html>
